[project]
name = "geec-assistant"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "psycopg2-binary",
    "mlflow",
]

[dependency-groups]
dev = [
    "ty>=0.0.12",
]

[[tool.uv.index]]
name = "databricks-proxy"
url = "https://pypi-proxy.dev.databricks.com/simple/"
default = true


[tool.apx.metadata]
app-name = "geec-assistant"
app-slug = "geec_assistant"
app-entrypoint = "geec_assistant.backend.app:app"
api-prefix = "/api"
metadata-path = "src/geec_assistant/_metadata.py"

[tool.apx.ui]
root = "src/geec_assistant/ui"

[tool.apx.ui.registries]
"@animate-ui" = "https://animate-ui.com/r/{name}.json"
"@ai-elements" = "https://registry.ai-sdk.dev/{name}.json"
"@svgl" = "https://svgl.app/r/{name}.json"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.version]
path = "src/geec_assistant/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/geec_assistant/__dist__", "src/geec_assistant/_metadata.py"]
exclude = ["src/geec_assistant/ui"]
